[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apc-ups-security-auditor"
version = "0.1.2"
description = "Automated default-credential detection and password hardening for APC UPS NMC3 using Playwright."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Bruno Teixeira" }
]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.47.0"
]

[project.urls]
Homepage = ""https://github.com/hacktivism-github/netauto/tree/development/apc-nmc3-ui-scraper""

[tool.setuptools]
packages = ["apc_ups_security_auditor"]
license-files = ["LICENSE", "LICENSE.txt"]

[project.scripts]
apc-ups-audit = "apc_ups_security_auditor.cli:main"
